[book]
title = "Desarrollo del Ecosistema Synapse"
authors = ["Synapse Native Team"]
language = "es"
description = "Guía técnica para desarrolladores y contribuidores del ecosistema Synapse"

[build]
build-dir = "book"

[output.html]
site-url = "https://synapse-native.github.io/synapse/desarrollo/"
edit-url-template = "https://github.com/synapse-native/synapse/edit/main/docs/book2-desarrollo/{path}"
additional-css = ["custom.css"]
additional-js = ["custom.js"]
no-section-label = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-hierarchical-headings = true

[output.html.watch]
watch = ["theme", "book.toml"]
