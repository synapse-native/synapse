[book]
title = "Sinopsis: Aprende Synapse, Syquex y OpenSyn"
authors = ["Synapse Native Team"]
language = "es"
description = "Manual completo para aprender el ecosistema Synapse desde cero hasta nivel avanzado"

[build]
build-dir = "book"

[output.html]
site-url = "https://synapse-native.github.io/synapse/aprendizaje/"
edit-url-template = "https://github.com/synapse-native/synapse/edit/main/docs/book1-aprendizaje/{path}"
additional-css = ["custom.css"]
additional-js = ["custom.js"]
no-section-label = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-hierarchical-headings = true

[output.html.watch]
watch = ["theme", "book.toml"]
