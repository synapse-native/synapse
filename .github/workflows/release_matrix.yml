# release_matrix.yml - Matrix for multi-platform release validation
# Generated for release v8.1.0-industrial

# Required platforms (from Manual 9 §4)
PLATAFORMAS_OBLIGATORIAS:
  - linux_x64
  - linux_arm64
  - darwin_arm64
  - win_x64

# Minimum binary size requirement
MIN_BINARY_SIZE: 100_000  # 100 KB minimum for valid binary

# Mandatory archive files
ARCHIVOS_OBLIGATORIOS:
  - synapse_rt.c
  - synapse_rt.h
  - axon/tweetnacl.c
  - axon/tweetnacl.h
  - main.py
  - pipeline.py
  - requirements.txt

# SHA-256 checksum calculation helper
SHA256_CHECK:
  - description: Calculate SHA-256 of a file
  - function: _calcular_sha256
  - parameters: route (str) → hex digest (str)

# Artifact upload configuration
ARTIFACT_UPLOAD:
  - description: Upload release artifacts
  - enabled: true

# SBOM generation
SBOM_GENERATION:
  - description: Generate SPDX-SBOM for the release
  - enabled: true

# Validation steps
VALIDATION_STEPS:
  - name: Validate platform targets
    description: Ensure exactly 4 mandatory platforms are defined
  - name: Check SHA-256 checksums
    description: Verify generated binaries have valid SHA-256 checksums
  - name: Upload artifacts
    description: Upload release artifacts to the registry
  - name: Calculate SBOM
    description: Generate SPDX-compatible SBOM for the release
  - name: Validate artifact structure
    description: Verify expected artifact structure (binary + .sha256 + .spdx.json)

# Continuation on error for flaky steps
CONTINUE_ON_ERROR:
  - description: Allow continuation on failure for non-critical steps
  - enabled: true

# Bootstrap configuration
BOOTSTRAP:
  - condition: "true"
  - description: Run conditional bootstrap step with continue-on-error
  - note: "Handles cases where synapse_unity.c is not present"
