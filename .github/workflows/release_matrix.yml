# cumple Manual 9 §4/§6.3: matrix de release multi-plataforma y sellado real.
# Genera binario + .sha256 + .sig por artefacto, SBOM SPDX, attestation SLSA,
# verifica cada firma y solo publica en GitHub Releases para tags v*.
# cumple Manual 9 §6.1: tras publicar, `verify_release` baja los assets del
# release y les exige firmas Ed25519 válidas (oráculo r274 `--firmas`).
name: Release Matrix

on:
  push:
    branches: [main, master, 'release/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release_matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plataforma: linux_x64
            binario: synapse-linux_x64
          - os: ubuntu-24.04-arm
            plataforma: linux_arm64
            binario: synapse-linux_arm64
          - os: macos-latest
            plataforma: darwin_arm64
            binario: synapse-darwin_arm64
          - os: windows-latest
            plataforma: win_x64
            binario: synapse-win_x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # cumple Manual 9 §6.2 (r322): el C emitido usa dialecto GNU (nested
      # functions, declaraciones implícitas) y el clang de macOS lo rechaza; el
      # bootstrap del target exige un GCC real, tal como resuelve pipeline.py.
      - name: Install GCC (darwin)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          GCC_REAL=""
          if command -v gcc >/dev/null 2>&1; then
            if ! gcc --version 2>&1 | grep -qi clang; then
              GCC_REAL="$(command -v gcc)"
            fi
          fi
          if [ -z "$GCC_REAL" ]; then
            brew install gcc || brew upgrade gcc
            PREFIJO="$(brew --prefix gcc)"
            VERSION="$(ls "$PREFIJO/bin" | sed -n 's/^gcc-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)"
            GCC_REAL="$PREFIJO/bin/gcc-$VERSION"
          fi
          echo "GCC_REAL=$GCC_REAL"
          "$GCC_REAL" --version | head -1
          echo "SYNAPSE_GCC_PATH=$GCC_REAL" >> "$GITHUB_ENV"

      - name: Bootstrap compiler (critical path)
        run: python build.py

      - name: Validate platform target
        run: |
          python -c "print('target validado: ${{ matrix.plataforma }}')"

      # La firma la ejecuta distribuir.py con nucleo.ed25519_signer (firmar_archivo).
      - name: Package and Sign binary with Ed25519 (Manual 9 §6.3)
        shell: bash
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
          SYNAPSE_BINARY_NAME: ${{ matrix.binario }}
        run: |
          if [ -z "$ED25519_PRIVATE_KEY" ]; then
            echo "::error::ED25519_PRIVATE_KEY no configurada; un release sin firma no es válido"
            exit 1
          fi
          python distribuir.py --requerir-firma

      - name: Verify signature with public key (SIGNATURE_VALID)
        shell: bash
        run: |
          python scripts/ci_sign.py verify \
            "instaladores/dist/distribucion/${{ matrix.binario }}" \
            "instaladores/dist/distribucion/${{ matrix.binario }}.sig" \
            "instaladores/dist/distribucion/synapse.pub" | tee verify.txt
          grep -q 'SIGNATURE_VALID=YES' verify.txt

      - name: Validate artifacts
        shell: bash
        run: |
          set -e
          DIST=instaladores/dist/distribucion
          test -f "$DIST/${{ matrix.binario }}"
          test -f "$DIST/${{ matrix.binario }}.sha256"
          test -f "$DIST/${{ matrix.binario }}.sig"
          test -f "$DIST/synapse.spdx.json"
          test -f "$DIST/synapse.attestation.json"
          test -f "$DIST/MANIFEST.sha256"
          test -f "$DIST/MANIFEST.sha256.sig"
          test -f "$DIST/synapse.pub"
          test -f "$DIST/synapse.iss"
          test -f "$DIST/install.sh"
          ls -la "$DIST"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binario }}
          path: instaladores/dist/distribucion/
          if-no-files-found: error

  # Gate de release "industrial" (Manual 9 §6.1/§6.3): cada plataforma
  # verifica lo que el usuario descarga — artefactos obligatorios, SHA-256,
  # firmas Ed25519 de cada artefacto y smoke real (--version, compilar y
  # ejecutar un programa, opensyn). Un release no se publica si este gate falla.
  smoke_release_limpio:
    needs: release_matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plataforma: linux_x64
            binario: synapse-linux_x64
          - os: ubuntu-24.04-arm
            plataforma: linux_arm64
            binario: synapse-linux_arm64
          - os: macos-latest
            plataforma: darwin_arm64
            binario: synapse-darwin_arm64
          - os: windows-latest
            plataforma: win_x64
            binario: synapse-win_x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binario }}
          path: instaladores/dist/distribucion

      - name: Smoke de release limpio
        shell: bash
        run: |
          set -e
          chmod +x "instaladores/dist/distribucion/${{ matrix.binario }}" || true
          python scripts/verificar_release_limpio.py --dist instaladores/dist/distribucion --binario "${{ matrix.binario }}" --json "docs/reportes/release_${{ matrix.plataforma }}.json" | tee smoke.txt
          grep -q '^PASS: release limpio' smoke.txt

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.plataforma }}
          path: docs/reportes/release_${{ matrix.plataforma }}.json
          if-no-files-found: error

  create_release:
    needs: [release_matrix, smoke_release_limpio]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Validate release bundle
        shell: bash
        run: |
          set -e
          test -f artifacts/synapse.pub
          test -f artifacts/synapse.spdx.json
          test -f artifacts/synapse.attestation.json
          test -f artifacts/MANIFEST.sha256
          test -f artifacts/MANIFEST.sha256.sig
          for sig in artifacts/*.sig; do
            test -s "$sig"
          done
          ls -la artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**
          generate_release_notes: true
          draft: false

  # Post-publicación: no se firma ni se reconstruye nada aquí. Se descargan los
  # assets del release recién creado (lo que realmente recibe el usuario) y el
  # oráculo r274 verifica que cada artefacto tenga su `.sig` válida con
  # `synapse.pub` publicado (Manual 9 §6.1/§6.3).
  verify_release:
    needs: create_release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p instaladores/dist/distribucion
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir instaladores/dist/distribucion --clobber
          ls -la instaladores/dist/distribucion

      - name: Verify Ed25519 signatures of published artifacts (Manual 9 §6.1)
        shell: bash
        run: |
          set -e
          python auditoria/oraculos/oraculo_r274_gates_independientes.py --firmas | tee firmas.txt
          grep -q 'PASS: firmas Ed25519' firmas.txt
