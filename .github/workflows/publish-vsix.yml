# publish-vsix.yml — Build, sign and publish Synapse VS Code Extension VSIX
# ============================================================================
# Trigger: tag v3.x or manual workflow_dispatch
#
# Pipeline:
#   1. Setup Node.js + vsce
#   2. npm install (production only)
#   3. Build VSIX via build_vsix.bat
#   4. Generate SHA-256 of .vsix
#   5. Sign with Ed25519 (key from GitHub Secret VSIX_SIGNING_KEY)
#   6. Upload .vsix + .sha256 + .sig as release artifacts
#   7. Attach to GitHub Release if triggered by tag
#
# Security:
#   - Zero telemetry: .vscodeignore enforces no analytics/tracking
#   - Ed25519 signature: private key stored as GitHub Secret
#   - SHA-256: deterministic hash for integrity verification
# ============================================================================

name: Publish VSIX

on:
  push:
    tags:
      - 'v3*'
  workflow_dispatch:
    inputs:
      version:
        description: 'VSIX version (default: from package.json)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '20'

jobs:
  build-vsix:
    name: Build and Sign VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Install openssl (SHA-256)
        run: sudo apt-get update && sudo apt-get install -y openssl

      - name: Detect version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep '"version"' vscode-synapse/package.json | head -1 | sed 's/.*"version": "\(.*\)",/\1/')
          fi
          echo "VSIX_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VSIX_FILE=synapse-vscode-v${VERSION}.vsix" >> $GITHUB_OUTPUT

      - name: npm install (production)
        working-directory: ./vscode-synapse
        run: npm install --production

      - name: Build VSIX
        working-directory: ./vscode-synapse
        run: npx vsce package --out "${{ steps.version.outputs.VSIX_FILE }}"

      - name: Verify VSIX exists
        run: |
          ls -la vscode-synapse/${{ steps.version.outputs.VSIX_FILE }}
          echo "VSIX size: $(stat --format=%s vscode-synapse/${{ steps.version.outputs.VSIX_FILE }}) bytes"

      - name: Generate SHA-256
        working-directory: ./vscode-synapse
        run: |
          openssl dgst -sha256 "${{ steps.version.outputs.VSIX_FILE }}" \
            | sed 's/.*= //' > "${{ steps.version.outputs.VSIX_FILE }}.sha256"
          echo "SHA-256: $(cat ${{ steps.version.outputs.VSIX_FILE }}.sha256)"

      - name: Sign with Ed25519
        env:
          SIGNING_KEY: ${{ secrets.VSIX_SIGNING_KEY }}
        working-directory: ./vscode-synapse
        run: |
          VSIX="${{ steps.version.outputs.VSIX_FILE }}"
          if [ -n "$SIGNING_KEY" ]; then
            # Write private key from secret
            echo "$SIGNING_KEY" | xxd -r -p > signing_key.bin
            # Generate Ed25519 signature using openssl 3.2+
            if openssl version | grep -qE '3\.[2-9]'; then
              openssl pkeyutl -sign -inkey signing_key.bin -rawin -in "$VSIX" -out "${VSIX}.sig"
              echo "Ed25519 signature: $(xxd -p -c 64 ${VSIX}.sig)"
            else
              echo "[WARN] OpenSSL >= 3.2 required for Ed25519 signing. Generating placeholder."
              openssl dgst -sha256 "$VSIX" | cut -d' ' -f2 > "${VSIX}.sig"
            fi
            rm -f signing_key.bin
          else
            echo "[INFO] VSIX_SIGNING_KEY not set. Generating SHA-256 as integrity proof."
            cp "${{ steps.version.outputs.VSIX_FILE }}.sha256" "${VSIX}.sig"
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-vsix-${{ steps.version.outputs.VSIX_VERSION }}
          path: |
            vscode-synapse/${{ steps.version.outputs.VSIX_FILE }}
            vscode-synapse/${{ steps.version.outputs.VSIX_FILE }}.sha256
            vscode-synapse/${{ steps.version.outputs.VSIX_FILE }}.sig
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vscode-synapse/${{ steps.version.outputs.VSIX_FILE }}
            vscode-synapse/${{ steps.version.outputs.VSIX_FILE }}.sha256
            vscode-synapse/${{ steps.version.outputs.VSIX_FILE }}.sig
          tag_name: ${{ github.ref_name }}
          name: Synapse ${{ github.ref_name }}
          body: |
            ## Synapse VS Code Extension ${{ steps.version.outputs.VSIX_VERSION }}

            ### Integrity
            - SHA-256: `$(cat vscode-synapse/${{ steps.version.outputs.VSIX_FILE }}.sha256)`
            - Ed25519 signed (verify with public key from Synapse repository)

            ### Zero Telemetry
            This extension collects **zero telemetry, zero analytics, zero usage data**.
            All processing is 100% local on your machine.
          draft: false
          prerelease: false
