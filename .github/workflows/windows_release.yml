name: Compilación Windows (Cero Fricción)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configurar Entorno C (MinGW)
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64
        static: 0

    - name: Bootstrap — Generar código C desde Synapse
      run: python main.py nucleo/principal.syn

    - name: Compilar binario estático
      run: |
        gcc -O2 -static -o synapse-windows-amd64.exe ^
          synapse_unity.c synapse_rt.c ^
          -I. -lws2_32

    - name: Adjuntar ejecutable al Release
      uses: softprops/action-gh-release@v1
      with:
        files: synapse-windows-amd64.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
