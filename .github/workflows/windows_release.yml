name: Compilación Windows (Cero Fricción)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configurar Entorno C (MinGW)
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64
        static: 0

    - name: Bootstrap — Generar código C desde Synapse
      run: python main.py nucleo/principal.syn

    - name: Compilar binario estático
      # ME-R1: enlazar el runtime modular completo (Manual 3 §3.1).
      # pool_alloc/pool_free/pool_init viven en runtime/core/memory.c;
      # crypto_sign_ed25519_tweet* en axon/tweetnacl.c (mapeado via tweetnacl.h).
      # shell: cmd explícito — la continuación con ^ es sintaxis cmd (no pwsh).
      shell: cmd
      run: |
        gcc -O2 -static -o synapse-windows-amd64.exe ^
          synapse_unity.c synapse_rt.c runtime/core/memory.c runtime/core/concurrency.c axon/tweetnacl.c ^
          -I. -lws2_32 -lm

    - name: Adjuntar ejecutable al Release
      uses: softprops/action-gh-release@v1
      with:
        files: synapse-windows-amd64.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
