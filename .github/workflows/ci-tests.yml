name: Synapse CI — Tests

on:
  push:
    branches: [ main, develop, '**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Bloquear scripts de parche (_fix_*.py)
        run: |
          FIX_FILES=$(find . -name '_fix_*.py' 2>/dev/null)
          if [ -n "$FIX_FILES" ]; then
            echo "❌ ERROR: Scripts de parche prohibidos encontrados:"
            echo "$FIX_FILES"
            exit 1
          fi
          echo "✅ No hay scripts de parche"

      - name: Bloquear artefactos .exe.c
        run: |
          EXE_C=$(find . -name '*.exe.c' 2>/dev/null)
          if [ -n "$EXE_C" ]; then
            echo "❌ ERROR: Artefactos .exe.c prohibidos encontrados:"
            echo "$EXE_C"
            exit 1
          fi
          echo "✅ No hay artefactos .exe.c"

      - name: Bloquear except-pass en Python
        run: |
          FOUND=0
          for f in $(find . -name '*.py' -not -path './.git/*' -not -path './toolchain_gcc12/*' 2>/dev/null); do
            if grep -n 'except\s*:\s*pass' "$f" > /dev/null 2>&1; then
              echo "❌ except: pass en $f"
              grep -n 'except\s*:\s*pass' "$f"
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 0 ]; then exit 1; fi
          echo "✅ No hay except: pass"

  test:
    needs: lint-and-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-md pytest-emoji flake8
          pip install -r requirements.txt

      - name: Verificar entorno
        run: |
          python --version
          python -c "import sys; print(f'Python {sys.version}')"
          python -c "import pytest; print(f'pytest {pytest.__version__}')"
          python -c "import flake8; print(f'flake8 {flake8.__version__}')"

      - name: Install GCC (darwin)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          GCC_REAL=""
          if command -v gcc >/dev/null 2>&1; then
            if ! gcc --version 2>&1 | grep -qi clang; then
              GCC_REAL="$(command -v gcc)"
            fi
          fi
          if [ -z "$GCC_REAL" ]; then
            brew install gcc || brew upgrade gcc
            PREFIJO="$(brew --prefix gcc)"
            VERSION="$(ls "$PREFIJO/bin" | sed -n 's/^gcc-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)"
            GCC_REAL="$PREFIJO/bin/gcc-$VERSION"
          fi
          echo "SYNAPSE_GCC_PATH=$GCC_REAL" >> "$GITHUB_ENV"

      - name: Instalar WABT (wat2wasm)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y wabt
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install wabt || brew upgrade wabt
          else
            choco install wabt -y --no-progress
          fi

      - name: Construir nativo (S1/S2)
        shell: bash
        # La suite usa los binarios y el runtime compilado; sin este paso los
        # oráculos E2E fallan por "binario no encontrado" en un runner limpio.
        run: python build.py --skip-test

      - name: Construir CLI y LSP nativos
        shell: bash
        # `build.py` produce stage2/stage3, pero la suite también ejerce el CLI
        # unificado (`synapse`) y el LSP nativo (`lsp_v3.exe`). Sin estos
        # artefactos los tests fallan por binario ausente en un runner limpio.
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp synapse_stage2.exe synapse.exe
          else
            cp synapse_stage2.exe synapse
            chmod +x synapse
          fi
          python main.py nucleo/lsp_v3.syn
          # H-R302-1: los dumps .c del S1 retirado no deben quedar en disco;
          # el build puede regenerarlos, así que se limpian antes de la suite.
          rm -f nucleo/analizador_semantico.c nucleo/ast_nodes.c \
                nucleo/diagnostics.c nucleo/errores.c nucleo/estado_global.c \
                nucleo/generator_constants.c

      - name: Ejecutar suite completa (release, paralela)
        shell: bash
        # La matriz std↔runtime (35 enlaces completos) corre en SU job aparte
        # (matriz-compilacion, D-R150-7): aquí se excluye para no duplicar el
        # costo en la matriz 3×3 de SO/Python.
        # Se ejecuta UNA vez en modo release (más estricto que el modo normal)
        # y con `--dist loadfile`, que es el aislamiento ya validado en shards:
        # antes la suite corría dos veces y en serie (2 h por job).
        env:
          PYTHONPATH: ${{ github.workspace }}
          SYNAPSE_BUILD_MODE: release
          CFLAGS: "-DNDEBUG -O3"
        run: |
          python -m pytest tests/ -q --tb=short -n auto --dist loadfile \
            --ignore=tests/auditoria/test_matriz_compilacion.py \
            --cov=. --cov-report=term-missing --cov-report=html:coverage_reports/

      - name: Compilar runtime (C) - Unix
        if: matrix.os != 'windows-latest'
        run: |
          gcc --version
          gcc -c synapse_rt.c -o synapse_rt.o -lpthread -lm
          gcc -c axon/tweetnacl.c -o tweetnacl.o -lm

      - name: Compilar runtime (C) - Windows
        if: matrix.os == 'windows-latest'
        run: |
          gcc --version
          gcc -c synapse_rt.c -o synapse_rt.o -lpthread -lws2_32
          gcc -c axon/tweetnacl.c -o tweetnacl.o -lm

      - name: Smoke test — compilar programas Synapse
        run: |
          python tests/run_tests.py

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage_reports/
          retention-days: 7

      - name: Notificar resultado
        if: always()
        run: |
          echo "## ✅ Tests completados para ${{ matrix.os }} / Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY

  suite-rapida:
    # cumple Manual 1 §7.2 + Manual 9 §6.2: la suite completa se ejecuta por
    # shards acotados para dar señal temprana (la suite entera tarda horas) y
    # los tests de red quedan fuera: `network` es opt-in. El job `test`
    # conserva la suite completa en cada target, que es la ley del Manual 9 §6.2.
    needs: lint-and-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, integration, auditoria, opensyn, syquex, e2e]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-md pytest-emoji
          pip install -r requirements.txt

      - name: Construir nativo (S1/S2)
        shell: bash
        run: python build.py --skip-test

      - name: Shard ${{ matrix.shard }} (sin red, en paralelo)
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: ${{ github.workspace }}
        # `--dist loadfile`: cada archivo cae en un solo worker, porque varios
        # tests escriben rutas fijas (tests/fixtures, dist/bin). Medido en
        # Windows: syquex 112,96 s -> 75,25 s con los mismos 281 passed/1 skipped.
        run: python -m pytest tests/${{ matrix.shard }} -q -m "not network" -n auto --dist loadfile

  suite-ratchet:
    # cumple Manual 1 §7.2: composición de la suite con ratchet contra
    # auditoria/suite_baseline.json — una suite no puede perder tests ni ganar
    # skips sin que la línea base lo registre. Es barato (sólo recolección).
    needs: lint-and-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Ratchet de composición de la suite
        env:
          PYTHONHASHSEED: '0'
        run: python auditoria/verificar_suite.py --resumen

  matriz-compilacion:
    # Oráculo matriz std↔runtime (OBL-R150-MATRIZ, Manual 1 §3, D-R150-7):
    # TODO std/*.syn compila con ENLACE COMPLETO via pipeline (no check_only)
    # y ejecuta rc=0. Es la frontera std↔runtime que ningún gate miraba
    # (causa raíz R149 §4). Job aparte por suite lenta (35 enlaces completos);
    # los jobs test/bootstrap lo excluyen con --ignore para no duplicarlo.
    # cumple Manual 1 §3
    runs-on: ubuntu-latest
    needs: lint-and-check
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar toolchain C (Backend GCC — Manual 1 §3)
        run: gcc --version

      - name: Matriz de compilación std↔runtime (35 módulos std)
        run: |
          python -m pytest tests/auditoria/test_matriz_compilacion.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  fuzz:
    needs: [test, matriz-compilacion]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar runtime objects
        run: |
          gcc -c synapse_rt.c -o synapse_rt.o -lpthread -lm
          gcc -c axon/tweetnacl.c -o tweetnacl.o -lm

      - name: Crear directorios de fuzzing
        run: |
          mkdir -p tests/fuzz/corpus tests/fuzz/crashes

      - name: Fuzzing rapido (500 iteraciones)
        run: |
          python tests/fuzz/fuzz_engine.py -n 500 2>&1 | tee fuzz.log
          if grep -q "CRASH" fuzz.log; then
            echo "❌ Fuzzing detecto crashes"
            grep "CRASH" fuzz.log
            exit 1
          fi
          echo "✅ Fuzzing superado"

      - name: Fuzzing con sanitizers (200 iteraciones)
        run: |
          python tests/fuzz/fuzz_engine.py -n 200 --sanitize 2>&1 | tee fuzz_san.log
          if grep -q "CRASH\|SANITIZER" fuzz_san.log; then
            echo "❌ Fuzzing con sanitizers detecto fallos"
            grep -E "CRASH|SANITIZER" fuzz_san.log
            exit 1
          fi
          echo "✅ Fuzzing con sanitizers superado"

      - name: Tests de fuzzing unitarios
        run: |
          python -m pytest tests/fuzz/test_fuzz.py -v --tb=short 2>&1 | tee fuzz_tests.log
          if grep -q "FAILED" fuzz_tests.log; then
            echo "❌ Tests de fuzzing fallaron"
            grep "FAILED" fuzz_tests.log
            exit 1
          fi
          echo "✅ Tests de fuzzing pasan"

      - name: Subir crashes como artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: tests/fuzz/crashes/
          retention-days: 30

      - name: Notificar fuzzing
        if: always()
        run: |
          echo "## ✅ Fuzzing CI completado" >> $GITHUB_STEP_SUMMARY

  bootstrap:
    needs: [test, fuzz]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bootstrap — generar binario nativo (Manual 9 S9.1)
        run: |
          # ME-R2: el pipeline compila el runtime modular desde fuente (build/obj/),
          # no se compilan .o a mano. Entrada: nucleo/principal.syn (Manual 9 S9.1).
          python main.py nucleo/principal.syn -o synapse_stage1.exe 2>&1 | tee bootstrap.log
          if grep -q "error:" bootstrap.log; then
            echo "❌ Bootstrap fallo"
            grep "error:" bootstrap.log
            exit 1
          fi
          if [ ! -f synapse_stage1.exe ]; then
            echo "❌ Bootstrap fallo: synapse_stage1.exe no generado"
            exit 1
          fi
          echo "✅ Bootstrap exitoso: synapse_stage1.exe"

      # cumple Manual 9 §6.1: "el proceso de bootstrap de 3 etapas produce
      # `diff 0 bytes` entre Stage 2 y Stage 3"; Manual 9 §2.3: "Verificar el
      # bootstrap (diff 0 bytes entre Stage 2 y Stage 3)". Sello del ROADMAP
      # §33.5: S2==S3 byte-idéntico en CI (job bootstrap).
      - name: Bootstrap Etapa 2 (stage1 auto-compila nucleo/principal.syn)
        run: |
          ./synapse_stage1.exe nucleo/principal.syn -o synapse_stage2.exe 2>&1 | tee bootstrap_stage2.log
          if grep -q "error:" bootstrap_stage2.log; then
            echo "❌ Bootstrap Etapa 2 fallo"
            grep "error:" bootstrap_stage2.log
            exit 1
          fi
          if [ ! -f synapse_stage2.exe ]; then
            echo "❌ Bootstrap Etapa 2 fallo: synapse_stage2.exe no generado"
            exit 1
          fi
          echo "✅ Bootstrap Etapa 2: synapse_stage2.exe"

      - name: Bootstrap Etapa 3 + sello S2==S3 (diff 0 bytes, sha256)
        run: |
          ./synapse_stage2.exe nucleo/principal.syn -o synapse_stage3.exe 2>&1 | tee bootstrap_stage3.log
          if grep -q "error:" bootstrap_stage3.log; then
            echo "❌ Bootstrap Etapa 3 fallo"
            grep "error:" bootstrap_stage3.log
            exit 1
          fi
          if [ ! -f synapse_stage3.exe ]; then
            echo "❌ Bootstrap Etapa 3 fallo: synapse_stage3.exe no generado"
            exit 1
          fi
          # El cálculo del sello vive en el oráculo del ME r252 (misma
          # implementación que usa build.py): un solo lugar para Manual 1 §6
          # y Manual 9 §6.1/§6.2.
          # `--sellar` (ME r270b, H-R252-5) certifica el hash del contenido de la
          # fuente, así que la frescura no depende del mtime del checkout.
          python auditoria/oraculos/oraculo_r252_paridad_bootstrap.py --artefactos --sellar
          echo "✅ Bootstrap sellado: S2==S3 byte-idénticos (oráculo r252)"

      # cumple Manual 9 §6.2: "El pipeline de CI/CD ejecuta automáticamente:
      # ... La verificación del bootstrap (diff 0 bytes)". El gate corre en su
      # propio paso y con su propio oráculo (ME r274), fuera de build.py.
      - name: Gate independiente de bootstrap (oráculo r274)
        run: |
          python auditoria/oraculos/oraculo_r274_gates_independientes.py

      - name: Verificar micro-tests (bootstrap nativo)
        run: |
          python scripts/run_micro_tests.py 2>&1 | tee micro.log
          if ! grep -q "Todos los tests pasaron" micro.log; then
            echo "❌ Micro-tests fallaron"
            exit 1
          fi
          echo "✅ Micro-tests pasan"

      - name: Tests de regresión post-bootstrap
        run: |
          python -m pytest tests/ -q --tb=short --ignore=tests/auditoria/test_matriz_compilacion.py 2>&1 | tee test.log
          if grep -q "FAILED" test.log; then
            echo "❌ Tests fallaron post-bootstrap"
            grep "FAILED" test.log
            exit 1
          fi
          echo "✅ Todos los tests pasan"

      - name: Notificar bootstrap
        if: always()
        run: |
          echo "## ✅ Bootstrap verification completado" >> $GITHUB_STEP_SUMMARY

  benchmark:
    needs: lint-and-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar runtime objects con ASan
        run: |
          gcc --version
          # runtime/core/memory.c (pool_alloc, pool_free) fue modularizado desde M0.2
          gcc -c -O2 -std=c11 -Wall -fsanitize=address -g \
            runtime/core/memory.c -o synapse_rt_memory_asan.o -I. -lpthread -lm
          echo "=== runtime (asan) OK ==="

      - name: Compilar benchmark con ASan
        run: |
          gcc -O2 -std=c11 -Wall -fsanitize=address -g \
            tests/bench_alloc.c synapse_rt_memory_asan.o \
            -o tests/bench_alloc_asan.exe -lm -lpthread
          echo "=== benchmark (asan) OK ==="

      - name: Ejecutar benchmark con ASan
        run: |
          echo "=== BENCHMARK ALLOC (ASan) ==="
          tests/bench_alloc_asan.exe --threads 4 --measure 10000 --warmup 500 2>&1 | tee benchmark_asan.log
          RC="${PIPESTATUS[0]}"
          if [ "$RC" -ne 0 ]; then
            echo "❌ ASan: benchmark fallo con codigo $RC — posible fuga"
            exit $RC
          fi
          echo "✅ ASan: 0 fugas de memoria"

      - name: Compilar runtime objects con TSan
        run: |
          gcc -c -O2 -std=c11 -Wall -fsanitize=thread -g \
            runtime/core/memory.c -o synapse_rt_memory_tsan.o -I. -lpthread -lm
          echo "=== runtime (tsan) OK ==="

      - name: Compilar benchmark con TSan
        run: |
          gcc -O2 -std=c11 -Wall -fsanitize=thread -g \
            tests/bench_alloc.c synapse_rt_memory_tsan.o \
            -o tests/bench_alloc_tsan.exe -lm -lpthread
          echo "=== benchmark (tsan) OK ==="

      - name: Ejecutar benchmark con TSan
        run: |
          echo "=== BENCHMARK ALLOC (TSan) ==="
          tests/bench_alloc_tsan.exe --threads 4 --measure 10000 --warmup 500 2>&1 | tee benchmark_tsan.log
          RC="${PIPESTATUS[0]}"
          if [ "$RC" -ne 0 ]; then
            echo "❌ TSan: benchmark fallo con codigo $RC — posible data race"
            exit $RC
          fi
          echo "✅ TSan: 0 data races"

      - name: Notificar benchmark
        if: always()
        run: |
          echo "## ✅ Benchmark M19.1 completado" >> $GITHUB_STEP_SUMMARY

  calidad-tests:
    # Gate de calidad de tests (Manual 7 §2.3): ningún test nuevo puede ser SNIFF
    # (assert substring en artefacto sin ejecutar/compilar) ni SIN_CITA (sin cita de
    # Manual). Modo incremental: solo evalúa los test_*.py modificados en este cambio,
    # para no bloquear la deuda SNIFF preexistente (se aborda aparte, sin romper la CI).
    runs-on: ubuntu-latest
    needs: lint-and-check

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calcular base para diff incremental
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1 2>/dev/null || true
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo HEAD~1)
          else
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)
          fi
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"

      - name: Auditar calidad de tests (incremental)
        run: |
          CHANGED=$(git diff --name-only "${{ steps.base.outputs.ref }}" HEAD -- tests || true)
          if [ -z "$CHANGED" ]; then
            echo "✅ Sin tests modificados en este cambio — gate de calidad omitido"
            exit 0
          fi
          echo "Tests modificados a auditar:"
          echo "$CHANGED"
          python auditoria/auditar_calidad_tests.py --files "$CHANGED"
          # Autenticación del MTO (bloqueante): entradas OBL con Manual § real
          # y secciones no fabricadas (deuda visible como AVISO).
          python auditoria/auditar_calidad_tests.py --solo-mto

  trazabilidad-codigo:
    # Cierre del bucle codigo<->manual para trabajo rutinario (no solo MTS):
    # exige que TODO archivo de produccion NUEVO (A) lleve un comentario de
    # trazabilidad (cumple Manual X §Y | requiere:/garantiza:). Así el repo no
    # acepta código de producción sin anclar a un manual, aunque no haya plan_ME.
    runs-on: ubuntu-latest
    needs: lint-and-check

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calcular base para diff incremental
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1 2>/dev/null || true
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo HEAD~1)
          else
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)
          fi
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"

      - name: Verificar trazabilidad de produccion nueva
        run: |
          FAIL=0
          while IFS=$'\t' read -r st f; do
            case "$st" in
              A*) ;;
              *) continue ;;
            esac
            case "$f" in
              # .syq incluido: bindings y frontends Syquex son producción real
              *.c|*.h|*.py|*.syn|*.syq) ;;
              *) continue ;;
            esac
            # Excluir paths no productivos (mirrors auditoria/registrar_lectura.py:es_produccion)
            case "$f" in
              tests/*|auditoria/*|docs/*|scripts/*|examples/*|.github/*|benchmarks/*|vscode-synapse/*|vendor/*) continue ;;
            esac
            case "$f" in
              _*) continue ;;   # regla 12: artefacto/instrumentacion temporal
            esac
            if ! grep -Eq 'cumple[[:space:]]+Manual[[:space:]]+[0-9]+|(requiere|garantiza):' "$f"; then
              echo "  ❌ Archivo de produccion nuevo sin trazabilidad: $f" >&2
              echo "    Agrega '// cumple Manual X §Y' (o '# cumple...' en Python) o requiere:/garantiza:." >&2
              FAIL=1
            fi
          done < <(git diff --name-status "${{ steps.base.outputs.ref }}" HEAD -- '*.c' '*.h' '*.py' '*.syn')
          if [ "$FAIL" -ne 0 ]; then
            echo "❌ TRAZABILIDAD DE CÓDIGO — commit bloqueado" >&2
            exit 1
          fi
          echo "✅ Trazabilidad de código verificada (archivos nuevos de producción)"

  manuales-integridad:
    # cumple Manual 2 §1.2 + Manual 1 §7.4 + Manual 9 §6.2: encoding UTF-8 sin
    # BOM, nombres canonicos/alias, indice vigente y citas Manual N §S validas.
    runs-on: ubuntu-latest
    needs: lint-and-check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar manuales y citas
        run: python auditoria/verificar_manuales.py --todo

  lectura-previa:
    # Gate de lectura previa (regla 1) en CI: exige que auditoria/lecturas.jsonl
    # (commiteado en el PR) cubra los archivos de produccion modificados. Asi no se
    # puede saltar con --no-verify: el servidor lo bloquea antes del merge.
    runs-on: ubuntu-latest
    needs: lint-and-check

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calcular base para diff incremental
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1 2>/dev/null || true
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo HEAD~1)
          else
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)
          fi
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"

      - name: Verificar lectura previa (CI)
        run: python auditoria/registrar_lectura.py --verificar-ci --base "${{ steps.base.outputs.ref }}"

  auditoria:
    # Gate de alineación con los manuales (R31): ningún push/PR puede introducir
    # brechas de trazabilidad (bitácora/reportes/hashes), deuda sin registrar,
    # código muerto en la raíz, módulos >1200 líneas sin registrar, ni funciones
    # nuevas sin requiere/garantiza (Manual 2 §12).
    # ENDURECIMIENTO: este job define SU PROPIO paso 'id: base' (antes usaba
    # steps.base sin definirlo => base vacía => git diff fallaba => 0 brechas
    # FALSAS, el gate más fuerte del servidor estaba muerto) y falla por EXIT
    # CODE del verificador (set -o pipefail), no por grep del log.
    runs-on: ubuntu-latest
    needs: lint-and-check

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calcular base para diff incremental
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1 2>/dev/null || true
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo HEAD~1)
          else
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)
          fi
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"

      - name: Verificar alineación con los manuales (auditoria/verificar_alineacion.py)
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          set -o pipefail
          python auditoria/verificar_alineacion.py --ci --base "$BASE_REF" 2>&1 | tee auditoria.log
          # El verificador sale rc=1 con brechas; pipefail impide que el tee
          # enmascare el código de salida. Sin brechas => rc=0 => gate verde.

  contratos:
    # Gate r277 (Manual 2 §5.1/§12): ninguna función pública NUEVA sin
    # `requiere` + `garantiza`. La deuda histórica se mide contra
    # auditoria/contratos_baseline.txt; --estricto es la meta (deuda 0).
    runs-on: ubuntu-latest
    needs: lint-and-check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Auditar contratos requiere/garantiza
        run: |
          set -o pipefail
          python auditoria/verificar_contratos.py --resumen 2>&1 | tee contratos.log

  mts-contraste:
    # Gate MTS (docs/METODO_TRABAJO.md): exige plan_ME_*.md para toda modificación
    # productiva y ejecuta contrastar.py (citación textual ↔ código ↔ oráculo).
    # Así un commit con --no-verify no mergea: CI requiere plan + evidencia.
    runs-on: ubuntu-latest
    needs: lint-and-check

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calcular base para diff incremental
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1 2>/dev/null || true
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo HEAD~1)
          else
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)
          fi
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"

      - name: Verificar plan_ME obligatorio para cambios productivos
        run: |
          BASE="${{ steps.base.outputs.ref }}"
          # .syq incluido: bindings y frontends Syquex son producción real
          PROD=$(git diff --name-only --diff-filter=ACM "$BASE" HEAD -- '*.c' '*.h' '*.py' '*.syn' '*.syq' \
                 | grep -vE '^(scripts/|tests/|auditoria/|docs/|benchmarks/|examples/|vscode-synapse/|.github/|.kilo/)' || true)
          PLAN=$(git diff --name-only --diff-filter=ACM "$BASE" HEAD \
                 | grep -E '^docs/plan_ME_.*\.md$' || true)
          if [ -n "$PROD" ] && [ -z "$PLAN" ]; then
            echo "❌ Cambios productivos sin docs/plan_ME_<id>.md:"
            echo "$PROD"
            exit 1
          fi
          if [ -z "$PLAN" ]; then
            echo "Sin cambios productivos ni plan_ME (ok)"
          fi

      - name: Ejecutar contrastar.py sobre TODOS los plan_ME staged (multi-ME)
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          # Todos los planes se contrastan JUNTOS: el vínculo estricto
          # archivo<->requisito se evalúa contra el conjunto (multi-ME).
          ARGS=""
          for pf in $(git diff --name-only --diff-filter=ACM "$BASE_REF" HEAD | grep -E '^docs/plan_ME_.*\.md$' || true); do
            echo "::group::Plan $pf"
            ARGS="$ARGS --plan $pf"
          done
          if [ -n "$ARGS" ]; then
            python auditoria/contrastar.py $ARGS --ci --base "$BASE_REF" || exit 1
          else
            echo "Sin planes staged (ok)"
          fi

  alineacion:
    # Gate de alineación manual<->código (docs/gobernancia/CONTROL_ALINEACION.md).
    # Exige que el cambio traiga su EXPEDIENTE (docs/alineacion/<ME>.md) con citas
    # textuales del manual y evidencia ejecutada (auditoria/evidencia/<hash>.json),
    # atados a la huella de los archivos de producción de base...HEAD. Así un commit
    # hecho con --no-verify no mergea.
    # Modo: ALINEACION_MODO=block (BLOQUEANTE) por defecto en CI; usar 'warn' solo para
    # migraciones temporales.
    runs-on: ubuntu-latest
    needs: lint-and-check

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calcular base para diff incremental
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1 2>/dev/null || true
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo HEAD~1)
          else
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)
          fi
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"

      - name: Verificar alineación manual<->código (alineacion.py)
        env:
          ALINEACION_MODO: ${{ vars.ALINEACION_MODO || 'block' }}
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          # ENDURECIMIENTO: se ELIMINA --sin-oraculos. Los oráculos declarados
          # en los expedientes SE EJECUTAN aquí en modo release (antes solo se
          # declaraban en CI y no corrían en ninguna capa: falso verde).
          # El expediente y su evidencia (auditoria/evidencia/<hash>.json) deben
          # estar COMITEADOS en el PR: alineacion.py --ci los lee de HEAD.
          python auditoria/alineacion.py --verificar \
            --desde "$BASE_REF" --ci \
            --modo "$ALINEACION_MODO"
