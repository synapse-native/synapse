name: Synapse CI — Tests

on:
  push:
    branches: [ main, develop, '**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-md pytest-emoji
          pip install -r requirements.txt 2>/dev/null || true

      - name: Verificar entorno
        run: |
          python --version
          python -c "import sys; print(f'Python {sys.version}')"
          python -c "import pytest; print(f'pytest {pytest.__version__}')"

      - name: Ejecutar tests unitarios y de integración
        run: |
          python -m pytest tests/ -v \
            --tb=short \
            --cov=. --cov-report=term-missing \
            --cov-report=html:coverage_reports/ \
            -x
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Compilar runtime (C)
        if: matrix.os != 'windows-latest'
        run: |
          gcc --version
          gcc -c synapse_rt.c -o synapse_rt.o -lpthread -lm

      - name: Compilar runtime (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          gcc --version
          gcc -c synapse_rt.c -o synapse_rt.o -lpthread -lws2_32

      - name: Smoke test — compilar programas Synapse
        run: |
          python tests/run_tests.py

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage_reports/
          retention-days: 7

      - name: Comprobar calidad de código (linting)
        run: |
          pip install flake8
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Notificar resultado
        if: always()
        run: |
          echo "## ✅ Tests completados para ${{ matrix.os }} / Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "Ver reporte de cobertura en los artifacts." >> $GITHUB_STEP_SUMMARY