# Cross-Compilation CI/CD Pipeline for Synapse v3.x
# Matrix build for 4 targets: linux_x86_64, linux_arm64, darwin_arm64, windows_x64
# Static MinGW/GCC toolchain injection + Ed25519/SHA-256 signing + Axon artifact upload

name: Cross-Compile Synapse

on:
  push:
    branches: [ main, master, release/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux_x86_64
          - linux_arm64
          - darwin_arm64
          - windows_x64

permissions:
  contents: read
  packages: write
  id-token: write

env:
  SYNAPSE_VERSION: "8.1.0-industrial"
  INNO_SETUP_VERSION: "6.7.1"
  # Ed25519 signing key (stored in GitHub Secrets as ED25519_PRIVATE_KEY)
  # SHA-256 hashes stored in release notes

jobs:
  # =============================================================================
  # 1. VALIDATE SOURCE STRUCTURE (runs on ubuntu-latest)
  # =============================================================================
  validate-source:
    name: Validate Source Structure
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------------------------
      # 2. Setup Python (para scripts embebidos)
      # -------------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # -------------------------------------------------------------------------
      # 2b. Verificar requirements.txt existe y es válido
      # -------------------------------------------------------------------------
      - name: Verify requirements.txt
        run: |
          test -f requirements.txt || { echo "FALTA requirements.txt"; exit 1; }
          pip install --dry-run -r requirements.txt 2>&1 | head -2 || { echo "requirements.txt inválido"; exit 1; }
          echo "requirements.txt válido ✓"
        shell: cmd

      # -------------------------------------------------------------------------
      # 3. Instalar Inno Setup Compiler (iscc) — chocolatey (más estable que descarga directa)
      # -------------------------------------------------------------------------
      - name: Install Inno Setup
        run: |
          choco install innosetup --version=${{ env.INNO_SETUP_VERSION }} -y --no-progress --source="'https://chocolatey.org/api/v2/'" 2>&1 | Select-Object -Last 10
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (Test-Path $isccPath) {
            $isccDir = Split-Path -Parent $isccPath
            Write-Host "Inno Setup instalado en: $isccPath"
            echo "$isccDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "::error::Inno Setup no encontrado tras instalacion"
            Get-ChildItem -Path 'C:\Program Files*' -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Found at: $($_.FullName)" }
            exit 1
          }
        shell: powershell

      # -------------------------------------------------------------------------
      # 4. Verificar iscc disponible
      # -------------------------------------------------------------------------
      - name: Verify ISCC
        run: |
          iscc /?
          echo "ISCC_VERSION=$(iscc /? 2>&1 | head -1)" >> $GITHUB_ENV

      # -------------------------------------------------------------------------
      # 4b. Construir el binario del compilador (ME-R6)
      # El instalador empaqueta dist\bin\synapse.exe; el link es el de ME-R1
      # (runtime modular completo: Manual 3 S3.1, Manual 9 S9.1).
      # -------------------------------------------------------------------------
      - name: Setup MinGW (ME-R6)
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          static: 0

      - name: Bootstrap y link estatico a dist\bin\synapse.exe (ME-R6)
        shell: cmd
        run: |
          python main.py nucleo/principal.syn
          if not exist dist\bin mkdir dist\bin
          gcc -O2 -static -o dist\bin\synapse.exe ^
            synapse_unity.c synapse_rt.c runtime/core/memory.c runtime/core/concurrency.c axon/tweetnacl.c ^
            -I. -lws2_32 -lm
          if not exist dist\bin\synapse.exe (echo FAIL: dist\bin\synapse.exe no generado & exit /b 1)

      # -------------------------------------------------------------------------
      # 5. Preparar estructura de archivos para instalador
      # -------------------------------------------------------------------------
      - name: Prepare installer artifacts
        run: |
          # ME-R6: dist\bin\synapse.exe ya fue construido por el paso 4b.
          # El .iss referencia los fuentes/headers del runtime desde la raiz del
          # checkout (synapse_rt.c, synapse_rt_types.h, runtime\core\*, ...).
          New-Item -ItemType Directory -Force -Path dist\bin
          New-Item -ItemType Directory -Force -Path vscode-synapse

          # VSIX placeholder (el .iss lo empaqueta)
          if (-not (Test-Path "vscode-synapse\synapse-vscode-v${{ env.SYNAPSE_VERSION }}.vsix")) {
            Write-Host "::warning::VSIX no encontrado, creando placeholder"
            "placeholder" | Out-File -Encoding utf8 vscode-synapse\synapse-vscode-v${{ env.SYNAPSE_VERSION }}.vsix
          }

          # Puerta: el instalador no puede compilarse sin el binario
          if (-not (Test-Path "dist\bin\synapse.exe")) {
            Write-Host "::error::dist\bin\synapse.exe NO fue generado (ME-R6)"
            exit 1
          }

      # -------------------------------------------------------------------------
      # 6. Compilar instalador con Inno Setup
      # -------------------------------------------------------------------------
      - name: Build Installer (ISCC)
        run: |
          iscc instalador_synapse.iss
        shell: cmd

      # -------------------------------------------------------------------------
      # 7. Verificar artefacto generado
      # -------------------------------------------------------------------------
      - name: Verify installer artifact
        run: |
          $installer = "dist\Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64.exe"
          if (Test-Path $installer) {
            $size = (Get-Item $installer).Length
            $sizeMB = [math]::Round($size / 1MB, 2)
            Write-Host "::notice::Instalador generado: $installer ($sizeMB MB)"

            # Verificar firma PE
            $bytes = [System.IO.File]::ReadAllBytes($installer)
            if ($bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
              Write-Host "::notice::Cabecera MZ válida (ejecutable PE)"
            } else {
              Write-Host "::error::Cabecera MZ INVÁLIDA"
              exit 1
            }

            if ($size -lt 10MB) {
              Write-Host "::warning::Tamaño sospechosamente pequeño (< 10MB)"
            }
          } else {
            Write-Host "::error::Instalador NO encontrado en $installer"
            Get-ChildItem dist\ -Recurse
            exit 1
          }

      # -------------------------------------------------------------------------
      # 8. Subir artefacto .exe (Instalador principal)
      # -------------------------------------------------------------------------
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64-installer
          path: dist/Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64.exe
          retention-days: 30

      # -------------------------------------------------------------------------
      # 9. Generar artefacto .zip alternativo (mitigación si iscc falla)
      # -------------------------------------------------------------------------
      - name: Create fallback ZIP artifact
        run: |
          $zipName = "dist\Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64.zip"
          Compress-Archive -Path dist\* -DestinationPath $zipName -Force
          $size = (Get-Item $zipName).Length
          $sizeMB = [math]::Round($size / 1MB, 2)
          Write-Host "::notice::ZIP fallback generado: $zipName ($sizeMB MB)"
        shell: powershell

      - name: Upload ZIP fallback artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64-zip
          path: dist/Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64.zip
          retention-days: 30

      # -------------------------------------------------------------------------
      # 10. Publicar Release si es tag
      # -------------------------------------------------------------------------
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64.exe
            dist/Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # JOB: Validación rápida sin iscc (fallback)
  # =============================================================================
  validate-source-structure:
    name: Validate Source Structure (Fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify requirements.txt
        run: |
          test -f requirements.txt || { echo "FALTA requirements.txt"; exit 1; }
          pip install --dry-run -r requirements.txt 2>&1 | head -2 || { echo "requirements.txt inválido"; exit 1; }
          echo "requirements.txt válido ✓"

      - name: Verify critical source files
        run: |
          # Verificar estructura mínima para instalador
          test -f instalador_synapse.iss || { echo "FALTA instalador_synapse.iss"; exit 1; }
          test -f nucleo/ai_orchestrator.c || { echo "FALTA nucleo/ai_orchestrator.c"; exit 1; }
          test -f nucleo/llama_client.c || { echo "FALTA nucleo/llama_client.c"; exit 1; }
          test -f nucleo/ai_orchestrator.h || { echo "FALTA nucleo/ai_orchestrator.h"; exit 1; }
          test -f nucleo/llama_client.h || { echo "FALTA nucleo/llama_client.h"; exit 1; }
          # build_installer.bat solo aplica en Windows; en Linux/macOS se salta
          if [ -f build_installer.bat ]; then
            :
          fi
          # test_llama_client_smoke.c y test_synapse_shutdown_hook.c son Windows-only
          echo "Estructura fuente válida ✓"

      - name: Verify .iss syntax (basic)
        run: |
          # Verificar secciones críticas en .iss
          grep -q "\[Setup\]" instalador_synapse.iss
          grep -q "\[Files\]" instalador_synapse.iss
          grep -q "\[Components\]" instalador_synapse.iss
          grep -q "\[Run\]" instalador_synapse.iss
          grep -q "ai_orchestrator" instalador_synapse.iss
          grep -q "llama_client" instalador_synapse.iss
          echo "Sintaxis .iss básica válida ✓"