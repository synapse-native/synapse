# =============================================================================
# release-installers.yml — Construcción automática de instaladores
# =============================================================================
# Construye instaladores para todas las plataformas cuando se crea un tag
# Publica en GitHub Releases
# =============================================================================

name: Release Installers

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej: 8.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================================================
  # WINDOWS INSTALLER
  # ===========================================================================
  windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Synapse binary
        shell: bash
        run: |
          python main.py nucleo/principal.syn
          gcc -O3 -fno-ident synapse_unity.c synapse_rt.o tweetnacl.o runtime_*.o -o synapse.exe -lws2_32 -lm

      - name: Create Inno Setup installer
        uses: jurplel/innosetup-action@v3
        with:
          script: instaladores/windows/synapse.iss

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          certutil -hashfile output/synapse-setup.exe SHA256 | grep -iv "hash" > output/synapse-setup.exe.sha256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-windows-installer
          path: output/synapse-setup.exe
          retention-days: 90

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: synapse-windows-installer.sha256
          path: output/synapse-setup.exe.sha256
          retention-days: 90

  # ===========================================================================
  # LINUX INSTALLER
  # ===========================================================================
  linux:
    name: Build Linux Installer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Synapse binary
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc
          python main.py nucleo/principal.syn
          gcc -O3 -fno-ident synapse_unity.c synapse_rt.o tweetnacl.o runtime_*.o -o synapse -lpthread -lm

      - name: Create tarball
        run: |
          tar -czf synapse-linux-x64.tar.gz synapse instaladores/linux/install.sh instaladores/linux/uninstall.sh

      - name: Generate SHA-256 checksum
        run: |
          sha256sum synapse-linux-x64.tar.gz > synapse-linux-x64.tar.gz.sha256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-linux-installer
          path: synapse-linux-x64.tar.gz
          retention-days: 90

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: synapse-linux-installer.sha256
          path: synapse-linux-x64.tar.gz.sha256
          retention-days: 90

  # ===========================================================================
  # MACOS INSTALLER
  # ===========================================================================
  macos:
    name: Build macOS Installer
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Synapse binary
        run: |
          python main.py nucleo/principal.syn
          for G in /opt/homebrew/bin/gcc-14 /opt/homebrew/bin/gcc-13 /usr/local/bin/gcc-14 /usr/local/bin/gcc-13 gcc-14 gcc-13; do
            if command -v "$G" &> /dev/null; then
              CC="$G"
              break
            fi
          done
          if [ -z "$CC" ]; then CC="gcc"; fi
          $CC -O3 -fno-ident synapse_unity.c synapse_rt.o tweetnacl.o runtime_*.o -o synapse -lpthread -lm

      - name: Create .app bundle
        run: |
          mkdir -p Synapse.app/Contents/MacOS
          mkdir -p Synapse.app/Contents/Resources
          cp synapse Synapse.app/Contents/MacOS/
          cat > Synapse.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>synapse</string>
              <key>CFBundleIdentifier</key>
              <string>com.synapse.lang</string>
              <key>CFBundleName</key>
              <string>Synapse</string>
              <key>CFBundleVersion</key>
              <string>8.1.0</string>
          </dict>
          </plist>
          EOF

      - name: Create DMG
        run: |
          hdiutil create -volname "Synapse" -srcfolder "Synapse.app" -ov -format UDZO synapse-macos.dmg

      - name: Generate SHA-256 checksum
        run: |
          shasum -a 256 synapse-macos.dmg > synapse-macos.dmg.sha256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-macos-installer
          path: synapse-macos.dmg
          retention-days: 90

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: synapse-macos-installer.sha256
          path: synapse-macos.dmg.sha256
          retention-days: 90

  # ===========================================================================
  # PUBLISH TO GITHUB RELEASES
  # ===========================================================================
  publish:
    name: Publish to GitHub Releases
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Synapse ${{ github.ref_name }}"
          body: |
            ## Synapse Ecosystem ${{ github.ref_name }}
            ### Instaladores
            #### Windows
            - `synapse-setup.exe` — Instalador con asistente
            - `synapse-setup.exe.sha256` — Verificación de integridad
            #### Linux
            - `synapse-linux-x64.tar.gz` — Archivo comprimido
            - `synapse-linux-x64.tar.gz.sha256` — Verificación de integridad
            #### macOS
            - `synapse-macos.dmg` — Imagen de disco
            - `synapse-macos.dmg.sha256` — Verificación de integridad
            ### Verificación de integridad
            Todos los instaladores incluyen checksums SHA-256 para verificar la integridad.
          files: |
            synapse-windows-installer/synapse-setup.exe
            synapse-windows-installer.sha256/synapse-setup.exe.sha256
            synapse-linux-installer/synapse-linux-x64.tar.gz
            synapse-linux-installer.sha256/synapse-linux-x64.tar.gz.sha256
            synapse-macos-installer/synapse-macos.dmg
            synapse-macos-installer.sha256/synapse-macos.dmg.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
