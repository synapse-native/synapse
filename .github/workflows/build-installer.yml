name: Build Synapse Installer (Fase 4.1)

on:
  push:
    branches: [ main, master, release/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - core_only

permissions:
  contents: read
  packages: write

env:
  SYNAPSE_VERSION: "2.2.2"
  INNO_SETUP_VERSION: "6.2.2"

jobs:
  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
      # -------------------------------------------------------------------------
      # 1. Checkout código
      # -------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # -------------------------------------------------------------------------
      # 2. Setup Python (para scripts embebidos)
      # -------------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # -------------------------------------------------------------------------
      # 2b. Verificar requirements.txt existe y es válido
      # -------------------------------------------------------------------------
      - name: Verify requirements.txt
        run: |
          test -f requirements.txt || { echo "FALTA requirements.txt"; exit 1; }
          pip install --dry-run -r requirements.txt 2>&1 | head -2 || { echo "requirements.txt inválido"; exit 1; }
          echo "requirements.txt válido ✓"
        shell: cmd
      
      # -------------------------------------------------------------------------
      # 3. Instalar Inno Setup Compiler (iscc)
      # -------------------------------------------------------------------------
      - name: Install Inno Setup
        uses: ashutoshvarma/install-innosetup@v1
        with:
          version: ${{ env.INNO_SETUP_VERSION }}
      
      # -------------------------------------------------------------------------
      # 4. Verificar iscc disponible
      # -------------------------------------------------------------------------
      - name: Verify ISCC
        run: |
          iscc /?
          echo "ISCC_VERSION=$(iscc /? 2>&1 | head -1)" >> $GITHUB_ENV
      
      # -------------------------------------------------------------------------
      # 5. Preparar estructura de archivos para instalador
      # -------------------------------------------------------------------------
      - name: Prepare installer artifacts
        run: |
          # Crear directorios esperados por instalador_synapse.iss
          New-Item -ItemType Directory -Force -Path dist\bin
          New-Item -ItemType Directory -Force -Path dist\lib
          New-Item -ItemType Directory -Force -Path dist\include
          New-Item -ItemType Directory -Force -Path dist\ia
          New-Item -ItemType Directory -Force -Path vscode-synapse
          
          # Copiar binarios core (si existen de build previo)
          if (Test-Path "synapse.exe") { Copy-Item synapse.exe dist\bin\ }
          if (Test-Path "*.dll") { Copy-Item *.dll dist\bin\ }
          
          # Placeholders para componentes IA (descarga real en instalador)
          # En CI real aquí se descargarían llama-server.exe y model.gguf
          # Ver: https://github.com/ggerganov/llama.cpp/releases
          # Ver: https://huggingface.co/TheBloke/Llama-3.2-1B-Instruct-GGUF
          
          # Archivos de configuración
          if (Test-Path "axon.toml") { Copy-Item axon.toml dist\ }
          if (Test-Path "synapse_rt.h") { Copy-Item synapse_rt.h dist\ }
          if (Test-Path "synapse_rt.c") { Copy-Item synapse_rt.c dist\ }
          if (Test-Path "tweetnacl.h") { Copy-Item tweetnacl.h dist\ }
          if (Test-Path "tweetnacl.c") { Copy-Item tweetnacl.c dist\ }
          
          # VSIX placeholder
          if (-not (Test-Path "vscode-synapse\synapse-vscode-v${{ env.SYNAPSE_VERSION }}.vsix")) {
            Write-Host "::warning::VSIX no encontrado, creando placeholder"
            "placeholder" | Out-File -Encoding utf8 vscode-synapse\synapse-vscode-v${{ env.SYNAPSE_VERSION }}.vsix
          }
          
          # Headers core IA
          Copy-Item nucleo\ai_orchestrator.h dist\include\ -Force
          Copy-Item nucleo\llama_client.h dist\include\ -Force
      
      # -------------------------------------------------------------------------
      # 6. Compilar instalador con Inno Setup
      # -------------------------------------------------------------------------
      - name: Build Installer (ISCC)
        run: |
          iscc instalador_synapse.iss
        shell: cmd
      
      # -------------------------------------------------------------------------
      # 7. Verificar artefacto generado
      # -------------------------------------------------------------------------
      - name: Verify installer artifact
        run: |
          $installer = "dist\Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64.exe"
          if (Test-Path $installer) {
            $size = (Get-Item $installer).Length
            $sizeMB = [math]::Round($size / 1MB, 2)
            Write-Host "::notice::Instalador generado: $installer ($sizeMB MB)"
            
            # Verificar firma PE
            $bytes = [System.IO.File]::ReadAllBytes($installer)
            if ($bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
              Write-Host "::notice::Cabecera MZ válida (ejecutable PE)"
            } else {
              Write-Host "::error::Cabecera MZ INVÁLIDA"
              exit 1
            }
            
            if ($size -lt 10MB) {
              Write-Host "::warning::Tamaño sospechosamente pequeño (< 10MB)"
            }
          } else {
            Write-Host "::error::Instalador NO encontrado en $installer"
            Get-ChildItem dist\ -Recurse
            exit 1
          }
      
      # -------------------------------------------------------------------------
      # 8. Subir artefacto .exe (Instalador principal)
      # -------------------------------------------------------------------------
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64-installer
          path: dist/Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64.exe
          retention-days: 30
      
      # -------------------------------------------------------------------------
      # 9. Generar artefacto .zip alternativo (mitigación si iscc falla)
      # -------------------------------------------------------------------------
      - name: Create fallback ZIP artifact
        run: |
          $zipName = "dist\Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64.zip"
          Compress-Archive -Path dist\* -DestinationPath $zipName -Force
          $size = (Get-Item $zipName).Length
          $sizeMB = [math]::Round($size / 1MB, 2)
          Write-Host "::notice::ZIP fallback generado: $zipName ($sizeMB MB)"
        shell: powershell
      
      - name: Upload ZIP fallback artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64-zip
          path: dist/Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64.zip
          retention-days: 30
      
      # -------------------------------------------------------------------------
      # 10. Publicar Release si es tag
      # -------------------------------------------------------------------------
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64.exe
            dist/Synapse-${{ env.SYNAPSE_VERSION }}-Windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # JOB: Validación rápida sin iscc (fallback)
  # =============================================================================
  validate-source:
    name: Validate Source Structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Verify requirements.txt
        run: |
          test -f requirements.txt || { echo "FALTA requirements.txt"; exit 1; }
          pip install --dry-run -r requirements.txt 2>&1 | head -2 || { echo "requirements.txt inválido"; exit 1; }
          echo "requirements.txt válido ✓"
      
      - name: Verify critical source files
        run: |
          # Verificar estructura mínima para instalador
          test -f instalador_synapse.iss || { echo "FALTA instalador_synapse.iss"; exit 1; }
          test -f nucleo/ai_orchestrator.c || { echo "FALTA nucleo/ai_orchestrator.c"; exit 1; }
          test -f nucleo/llama_client.c || { echo "FALTA nucleo/llama_client.c"; exit 1; }
          test -f nucleo/ai_orchestrator.h || { echo "FALTA nucleo/ai_orchestrator.h"; exit 1; }
          test -f nucleo/llama_client.h || { echo "FALTA nucleo/llama_client.h"; exit 1; }
          test -f build_installer.bat || { echo "FALTA build_installer.bat"; exit 1; }
          test -f test_llama_client_smoke.c || { echo "FALTA test_llama_client_smoke.c"; exit 1; }
          test -f test_synapse_shutdown_hook.c || { echo "FALTA test_synapse_shutdown_hook.c"; exit 1; }
          echo "Estructura fuente válida ✓"
      
      - name: Verify .iss syntax (basic)
        run: |
          # Verificar secciones críticas en .iss
          grep -q "\[Setup\]" instalador_synapse.iss
          grep -q "\[Files\]" instalador_synapse.iss
          grep -q "\[Components\]" instalador_synapse.iss
          grep -q "\[Run\]" instalador_synapse.iss
          grep -q "ai_orchestrator" instalador_synapse.iss
          grep -q "llama_client" instalador_synapse.iss
          echo "Sintaxis .iss básica válida ✓"