[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers para selección por categoría
markers =
    unit: Tests unitarios del compilador (M1, M2)
    integration: Tests de integración (M2-M8)
    syquex: Tests de Syquex (M3, M4)
    opensyn: Tests de OpenSyn (M7)
    fuzz: Fuzzing destructivo (M1 §7.2)
    stress: Pruebas de estrés (M1 §7.2)
    security: Tests de seguridad
    slow: Tests que tardan >30s
    bootstrap: Tests del proceso de bootstrap

# Configuración por defecto
addopts = -v --tb=short
timeout = 300
