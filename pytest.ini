[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers para selección por categoría
markers =
    unit: Tests unitarios del compilador (M1, M2)
    integration: Tests de integración (M2-M8)
    syquex: Tests de Syquex (M3, M4)
    opensyn: Tests de OpenSyn (M7)
    fuzz: Fuzzing destructivo (M1 §7.2)
    stress: Pruebas de estrés (M1 §7.2)
    security: Tests de seguridad
    slow: Tests que tardan >30s
    bootstrap: Tests del proceso de bootstrap
    tdd: Tests de desarrollo guiado por tests (TDD)
    e2e: Tests end-to-end
    network: Tests que usan red real (opt-in; excluidos por defecto con -m "not network")

# Configuración por defecto
addopts = -v --tb=short
timeout = 300

# Paralelismo (ME r279b_suite_paralela): no se fuerza en `addopts` porque
# varios tests escriben rutas fijas (tests/fixtures, dist/bin). Se activa
# explícitamente con `-n auto --dist loadfile` (un archivo por worker): es lo
# que usan los shards de CI. Medido en Windows: syquex 112,96 s -> 75,25 s con
# los mismos 281 passed / 1 skipped.
