# .pre-commit-config.yaml — Synapse pre-commit hooks
# Instalacion: pip install pre-commit && pre-commit install
# Ejecucion manual: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      # ============================================================
      # BLOQUEO: Scripts de parche temporales (_fix_*.py)
      # ============================================================
      - id: block-patch-scripts
        name: Bloquear scripts de parche _fix_*.py
        entry: Scripts de parche temporales (_fix_*.py) no deben committearse
        language: fail
        files: '_fix_.*\.py$'

      # ============================================================
      # BLOQUEO: Artefactos de compilacion (.exe.c)
      # ============================================================
      - id: block-exe-c-artifacts
        name: Bloquear artefactos .exe.c
        entry: Artefactos .exe.c no deben committearse
        language: fail
        files: '\.exe\.c$'

      # ============================================================
      # BLOQUEO: except: pass en archivos Python
      # ============================================================
      - id: block-except-pass
        name: Bloquear except: pass
        entry: Bloques 'except: pass' silenciosos prohibidos
        language: pygrep
        types: [python]
        pattern: 'except\s*:\s*pass'

      # ============================================================
      # BLOQUEO: Binarios .exe en el arbol de fuente
      # ============================================================
      - id: block-exe-binaries
        name: Bloquear binarios .exe en source tree
        entry: Archivos .exe no deben committearse en source tree
        language: fail
        files: '\.exe$'
        exclude: '^build/bin/|^dist/'

  # ============================================================
  # hooks preestablecidos (comunitarios)
  # ============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100, --target-version=py310]
